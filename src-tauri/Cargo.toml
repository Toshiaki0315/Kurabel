[package]
name = "kurabel"
version = "0.1.0"
description = "Diff & Merge Tool"
authors = ["Toshiaki0315"]
edition = "2021"

[lib]
name = "kurabel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.3.0" # 差分検出用ライブラリ
hex = "0.4.3" # バイナリ処理用
walkdir = "2.4.0" # ディレクトリトラバーサル用
encoding_rs = "0.8.44"
chardetng = "1.0.0"
regex = "1.13.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
